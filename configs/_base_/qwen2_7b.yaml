api_model:
    provider: "huggingface"
    model_name : "Qwen/Qwen2-7B"
    use_logprobs: true
    n_api_samples: null
    inference_provider: 'deepinfra'
    is_local: true
    model_cfg:
        type: AutoModelForCausalLM
        torch_dtype: bfloat16
    tokenizer_cfg:
        type: AutoTokenizer
        use_fast: true
    special_tokens:
        pad_token: "<|endoftext|>"  # Qwen2 has no dedicated pad token; reuse EOS


tokenizer_run_cfg:
    padding: true
    truncation: true
    return_tensors: "pt"
    max_length: 300
