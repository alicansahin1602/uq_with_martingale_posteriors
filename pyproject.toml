[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uq-with-martingale-posteriors"
version = "0.1.0"
description = "Uncertainty quantification for LLMs using Martingale Posteriors"
requires-python = ">=3.10"

# NOTE: PyTorch is listed here for completeness, but the CPU wheel from PyPI
# is installed by default. For GPU use, install the correct CUDA variant first:
#   pip install torch --index-url https://download.pytorch.org/whl/cu121
# then run `pip install -e .` — pip will skip torch since it is already satisfied.
dependencies = [
    # --- core ML ---
    "torch>=2.1.0",
    "transformers>=4.40.0",   # 4.40+ required for Qwen2 support
    "peft>=0.10.0",
    "accelerate>=0.27.0",     # required by transformers/peft for training
    # --- data ---
    "datasets>=2.18.0",       # HuggingFace datasets (ai2_arc, commonsense_qa, …)
    # --- config & logging ---
    "mmengine>=0.10.3",
    "wandb>=0.16.0",
    # --- metrics ---
    "torchmetrics>=1.3.0",
    "scikit-learn>=1.4.0",
    # --- numerics ---
    "numpy>=1.24.0",
    "scipy>=1.12.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",        # Excel (.xlsx) read/write engine for pandas
    "statsmodels>=0.14.0",    # Kalman filter / state-space (local-level) models
    # --- UQ methods ---
    "bayesian-lora>=0.0.6",   # Laplace LoRA (Yang et al., ICLR 2024)
    "ptflops>=0.7.0",         # FLOPs estimation
    # --- API providers ---
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    # --- retrieval ---
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["martingale_consistency_and_posteriors*"]